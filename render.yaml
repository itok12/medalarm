services:
  - type: web
    name: medalarm-backend
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: medalarm-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: medalarm-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: medalarm-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_ENABLED
        value: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://medalarm.app,https://www.medalarm.app,https://medalarmapp.com,https://www.medalarmapp.com,https://*.onrender.com

  - type: web
    name: medalarm-frontend
    runtime: docker
    plan: free
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    autoDeployTrigger: checksPass
    healthCheckPath: /
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://medalarm-backend-1jax.onrender.com

databases:
  - name: medalarm-db
    databaseName: medalarm
    plan: free
