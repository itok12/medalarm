version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: medalarm
      POSTGRES_USER: medalarm
      POSTGRES_PASSWORD: medalarm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/medalarm
      DATABASE_USERNAME: medalarm
      DATABASE_PASSWORD: medalarm
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend

volumes:
  postgres_data:
