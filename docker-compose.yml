version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medalarm}
      POSTGRES_USER: ${POSTGRES_USER:-medalarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medalarm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-medalarm}
      DATABASE_USERNAME: ${POSTGRES_USER:-medalarm}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-medalarm}
      JWT_SECRET: ${JWT_SECRET:-medalarm-super-secret-key-change-in-production-at-least-32-chars}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      MEDALARM_REVIEW_USERNAME: ${MEDALARM_REVIEW_USERNAME:-}
      MEDALARM_REVIEW_EMAIL: ${MEDALARM_REVIEW_EMAIL:-}
      MEDALARM_REVIEW_PASSWORD: ${MEDALARM_REVIEW_PASSWORD:-}
      MEDALARM_REVIEW_TIMEZONE: ${MEDALARM_REVIEW_TIMEZONE:-Europe/London}
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:8080/api}
    depends_on:
      - backend

volumes:
  postgres_data:
