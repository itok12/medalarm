spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
jwt.secret=${JWT_SECRET:medalarm-super-secret-key-change-in-production-at-least-32-chars}
jwt.expiration=86400000
jwt.refresh-token-days=7
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=${MAIL_ENABLED:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
medalarm.demo-seed.enabled=${DEMO_SEED_ENABLED:false}
