spring:
  datasource:
    url: jdbc:h2:mem:medalarm
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

app:
  ml-service:
    url: http://localhost:8000/extract-medicine-info

jwt:
  secret: medalarm-super-secret-key-change-in-production-at-least-32-chars
  expiration: 86400000

medalarm:
  email:
    enabled: ${MAIL_ENABLED:false}
