spring:
  datasource:
    url: jdbc:h2:mem:medalarm
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  ml-service:
    url: http://localhost:8000/extract-medicine-info

jwt:
  secret: medalarm-super-secret-key-change-in-production-at-least-32-chars
  expiration: 86400000

