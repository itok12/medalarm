spring:
  datasource:
    url: jdbc:h2:mem:medalarm-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: false
  mail:
    host: localhost
    port: 2525

management:
  health:
    mail:
      enabled: false

app:
  ml-service:
    url: http://localhost:8000/extract-medicine-info

jwt:
  secret: medalarm-super-secret-key-change-in-production-at-least-32-chars
  expiration: 86400000
  refresh-token-days: 7

medalarm:
  demo-seed:
    enabled: true
